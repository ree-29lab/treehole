<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>树洞 · 入口</title>
<style>
  :root { --bg:#12100e; --card:#211d19; --line:#322c26; --text:#ece5dc; --dim:#a1938a; --accent:#e0a458; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#faf7f2; --card:#fff; --line:#e2d9cd; --text:#2b2621; --dim:#7a6e63; --accent:#a5671f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); padding: 1.5rem;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .card { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 1.5rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--dim); font-size: .92rem; margin: .5rem 0; }
  a.go { display: inline-block; margin: 1rem 0 .5rem; padding: .6rem 1.6rem; border-radius: 999px; background: var(--accent); color: #241a10; font-weight: 600; text-decoration: none; }
  .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: var(--accent); margin-right: .35rem; }
  .off { background: #7a6e63; }
  footer { margin-top: 1rem; font-size: .78rem; color: var(--dim); }
</style>
</head>
<body>
<div class="card">
  <h1>🌳 树洞</h1>
  <p id="state"><span class="dot off"></span>正在看看门开了没有…</p>
  <p id="hint" style="display:none"></p>
  <a class="go" id="go" href="#" style="display:none">进去</a>
  <footer>
    这里说的话不记名，也请不要写下任何能指认到具体人的信息。<br>
    如果此刻很难受：<strong>12356</strong> 全国心理援助热线（24 小时）。
  </footer>
</div>
<script>
(function () {
  // 当前隧道地址放在一个 secret gist 里，由 bin/start.sh / bin/stop.sh 自动更新。
  // 优先走 api.github.com（内容永远是最新的），失败再退回 CDN 直链（可能有点旧）。
  // 下面两行由 bin/setup.sh 自动改写，别手改。
  var GIST_ID = '4f04245b3bf4abc77914dd26da2ba8cf';
  var GIST_OWNER = 'ree-29lab';
  var NOW_API = 'https://api.github.com/gists/' + GIST_ID;
  var NOW_RAW = 'https://gist.githubusercontent.com/' + GIST_OWNER + '/' + GIST_ID + '/raw/now.json';

  var state = document.getElementById('state');
  var hint = document.getElementById('hint');
  var go = document.getElementById('go');
  var phrase = decodeURIComponent(location.hash.replace(/^#/, ''));

  function show(text, extra) {
    state.innerHTML = '<span class="dot off"></span>' + text;
    if (extra) { hint.textContent = extra; hint.style.display = 'block'; }
  }

  function fromApi() {
    return fetch(NOW_API + '?t=' + Date.now(), {
      cache: 'no-store',
      headers: { Accept: 'application/vnd.github+json' }
    })
      .then(function (response) {
        if (!response.ok) throw new Error('api ' + response.status);
        return response.json();
      })
      .then(function (gist) {
        return JSON.parse(gist.files['now.json'].content);
      });
  }

  function fromRaw() {
    return fetch(NOW_RAW + '?t=' + Date.now(), { cache: 'no-store' }).then(function (response) {
      if (!response.ok) throw new Error('raw ' + response.status);
      return response.json();
    });
  }

  // 先探一下门到底通不通：隧道地址刚换过时，有些网络会短暂解析不到，
  // 直接跳过去会看到浏览器的报错页，不如在这里说清楚并给个重试。
  function probe(origin, target) {
    return fetch(origin + '/healthz', { mode: 'no-cors', cache: 'no-store' })
      .then(function () {
        state.innerHTML = '<span class="dot"></span>门开着，正在带你进去…';
        go.href = target;
        go.textContent = '进去';
        go.style.display = 'inline-block';
        setTimeout(function () { location.replace(target); }, 600);
      })
      .catch(function () {
        go.href = target;
        go.textContent = '还是想试试';
        go.style.display = 'inline-block';
        // 探不通不等于「访客网络有问题」——最常见的原因是主人那边隧道断了/电脑睡了。
        show('门没开，或者你这边暂时连不上。', '可能是主人不在电脑边、隧道刚断，也可能是你的网络。等半分钟点下面这个按钮再试一次；还不行就找给你链接的人要一下。');
      });
  }

  fromApi()
    .catch(fromRaw)
    .then(function (info) {
      if (!info || !info.online || !info.url) {
        show('树洞现在没开门。', '主人在的时候才有门。找给你链接的人要一下，或者过会儿再来。');
        return;
      }
      probe(info.url, info.url + (phrase ? '/?k=' + encodeURIComponent(phrase) : '/'));
    })
    .catch(function () {
      show('连不上入口页。', '检查一下网络，或者找给你链接的人要新的地址。');
    });
})();
</script>
</body>
</html>
